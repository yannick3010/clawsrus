# Template for per-customer Docker Compose
# Variables are substituted by provision-user.sh at provisioning time

services:
  openclaw:
    image: node:22-bookworm
    container_name: clawsrus-${CUSTOMER_ID}
    working_dir: /home/node
    command: >
      sh -c "npm install -g openclaw &&
             openclaw gateway run --allow-unconfigured"
    volumes:
      - ./openclaw:/home/node/.openclaw
    environment:
      - NODE_ENV=production
      - HOME=/home/node
    deploy:
      resources:
        limits:
          cpus: '${CPU_LIMIT:-1}'
          memory: ${MEMORY_LIMIT:-1G}
    restart: unless-stopped
    networks:
      - clawsrus-network

networks:
  clawsrus-network:
    external: true
