# Template for per-customer Docker Compose
# Variables are substituted by provision-user.sh at provisioning time

services:
  openclaw:
    image: ${OPENCLAW_IMAGE:-clawsrus/openclaw-runtime:2026.2.17-r1}
    container_name: clawsrus-${CUSTOMER_ID}
    working_dir: /home/node
    command: ["gateway", "run", "--allow-unconfigured"]
    volumes:
      - ./openclaw:/home/node/.openclaw
    environment:
      - NODE_ENV=production
      - HOME=/home/node
      - NODE_OPTIONS=--max-old-space-size=${NODE_HEAP_MB:-768}
    cpus: '${CPU_LIMIT:-1}'
    mem_limit: ${MEMORY_LIMIT:-1G}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:18789/openclaw/"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    networks:
      - clawsrus-network

networks:
  clawsrus-network:
    external: true
